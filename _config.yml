# ─────────────────────────────────────────────────────────────
#  Y-Lab, Jekyll configuration
# ─────────────────────────────────────────────────────────────

title: "Y-Lab"
tagline: "Mechanical Intelligence for Soft Robots"
description: >-
  Welcome to the Y-Lab homepage at UC Davis. We develop next-generation soft and
  bio-inspired robots by integrating Mechanical Intelligence (MI) with
  Computational Intelligence (AI).

# Site address. `url` is the ORIGIN only (no path, no trailing slash).
# Leave `baseurl` EMPTY, the deploy workflow fills in the project path
# automatically at build time.
url: "https://y-lab-uc-davis.github.io"
baseurl: ""

# ── Google Search Console verification ───────────────────────
# google_site_verification: ""

lab:
  institution: "University of California, Davis"
  location: "Department of Mechanical & Aerospace Engineering, Bainer Hall, UC Davis, Davis, CA"
  full_name: "Y-Lab (Mechanical Intelligence and Soft Robotics Lab)"
  founded: 2025
  pi: "Dr. Wenzhong Yan"
  pi_email: "wyan@ucdavis.edu"
  orcid: "0000-0002-3711-0807"
  scholar: "https://scholar.google.com/citations?user=YHx-3YIAAAAJ"
  # PI / lab links surfaced in the footer and Data & Code section.
  linkedin: ""
  instagram: ""
  instagram_handle: ""
  github_org: "https://github.com/Y-Lab-UC-Davis"
  # FigShare (or other data repository) for published data/code.
  figshare_url: ""

# Default social-share (Open Graph) image used by jekyll-seo-tag.
image:
  path: /assets/img/og-image.png
  width: 1200
  height: 630

# Big summary card on X/Twitter (instead of the tiny square default).
twitter:
  card: summary_large_image

# Optional image assets. 
# Pages only render the image when its path is set, so the build never references a missing file.
assets:
  # Optional hero background video + poster image for the Home page.
  hero_video: ""
  hero_poster: ""
  # Lab group photo. Powers BOTH the People-page group photo
  # and the Home group photo band.
  lab_photo: ""
  # Playful candid shown as the "lab culture" moment on the Join page.
  culture_photo: ""

# Private member workspace (Notion - Internal Pages).
member_portal_url: ""

# Undergraduate interest form
undergrad_form_url: ""

# Privacy-friendly, cookieless analytics (GoatCounter). 
analytics:
  goatcounter: ""   


# ── Build settings ───────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at   # per-page "Last updated" date, from git history

# ── Lab guide category order ─────────────────────────────────
# Single source of truth for the guide's category order. Both the guide
# landing page and the wiki sidebar read from this. Add a new category
# here when you introduce one (the landing page warns if you forget).
guide_order:
  - Getting Started
  - Communication & Culture
  - Working in the Lab
  - Research Workflow
  - Writing & Dissemination
  - Professional Development

# ── Collections ──────────────────────────────────────────────
collections:
  guide:
    output: true
    permalink: /lab-guide/:name/

defaults:
  - scope: { path: "", type: "guide" }
    values: { layout: "wiki" }
  - scope: { path: "" }
    values: { layout: "page" }

exclude:
  - README.md
  - MAINTENANCE.md
  - ARCHITECTURE.md
  - CONTENT-GUIDE.md
  - CONTRIBUTING.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
  - pa11yci.json
  # FUSE / editor-sync artifacts (".fuse_hiddenXXXX") can appear in collection
  # folders when a file is edited while another process holds it open. They carry
  # stale, sometimes corrupted front matter (a missing category shows up as a
  # blank card on the Lab Guide hub), so keep them out of the build entirely.
  - ".fuse_hidden*"
  - "_guide/.fuse_hidden*"

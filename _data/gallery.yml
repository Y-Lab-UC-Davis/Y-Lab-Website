# ─────────────────────────────────────────────────────────────
#  SCENES FROM THE LAB
#  Photos for home page gallery or lab culture strip.
#
#  Each scene renders ONLY when ready: true, so the build never points at a
#  missing image. Workflow:
#    1. Put the original in  assets/img/lab/_raw/  (name it raptor-hall / outreach
#       / wind-tunnel) and run  bash scripts/apply-images.sh
#    2. Flip ready: true here.
#  alt: is REQUIRED, a scene without it will not render (accessibility rule:
#  every photo needs a description for screen-reader users).
#  Captions are in the lab's voice, edit freely; keep them short.
#
#  EXAMPLE ENTRY:
#
#  scenes:
#    - file: /assets/img/lab/group-photo.jpg
#      alt: "Lab group standing together in the lab"
#      caption: "Our team working in the lab."
#      ready: true
# ─────────────────────────────────────────────────────────────

scenes: 

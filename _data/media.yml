# ─────────────────────────────────────────────────────────────
#  MEDIA
#  Videos, podcasts, and interactive media items for /news/
#
#  Shown on the News page, separate from written press coverage. These are
#  LINKS OUT (no embeds), so the page stays fast and cookie-free.
#
# 
#    kind : video | podcast | radio | model
#
#  THUMBNAIL CARD vs COMPACT ROW:
#    featured : true   → a big thumbnail card. Needs a thumbnail source: a YouTube
#                        link (thumbnail is automatic) or an `image:` path.
#  Without `featured`, every item — including videos — renders as a compact row.
#    image : /assets/img/news/…  → thumbnail for a featured NON-YouTube card.
#
#  OPTIONAL, per entry (like the press archive):
#    doi : "10.xxxx/…"  → adds a blue "📄 Paper" link to the peer-reviewed source
#    tag : "Award"       → adds a reason chip: Center · Award · Funding · Profile · Feature
# 
#  EXAMPLE ENTRY:
#
#  - title: "Lab Research Feature"
#    kind: video # video | podcast | radio | model
#    source: "News Outlet Name"
#    year: 2026
#    url: "https://www.youtube.com/watch?v=example"
#    featured: true
#    tag: "Feature"
# ─────────────────────────────────────────────────────────────

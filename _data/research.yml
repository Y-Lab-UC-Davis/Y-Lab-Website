# ─────────────────────────────────────────────────────────────
#  RESEARCH 
#  Defines the research themes and project directory for /research/
#
#  Each project is a small card: a one-sentence blurb, its theme, the lead
#  (linked to their People entry), and an "ask the lead" email button.
#  `lead` must match the person's name in _data/people.yml for the link to work.
#  `papers` is a list of DOIs that belong to THIS project. The card looks each
#  one up in the publications data and shows its title + year + link. To feature
#  a new paper, paste its DOI here (one line). `image` and `contact` are optional.
# 
#  EXAMPLE STRUCTURE:
#
#  themes:
#    - id: theme-id-slug
#      title: Theme Title
#      short: One sentence summary of theme focus.
#      blurb: Detailed paragraph explaining research direction.
#      why: Sentence explaining why this research area matters.
#
#  projects:
#    - title: Project Name
#      lead: Researcher Name (matches name in people.yml)
#      papers:
#        - "10.xxxx/xxxx" # Optional DOIs linked to this project
#      contact: lead@university.edu
#      theme: theme-id-slug
#      image: /assets/img/research/project.jpg
#      blurb: One sentence summary of project goals.
# ─────────────────────────────────────────────────────────────

themes: 

projects: 

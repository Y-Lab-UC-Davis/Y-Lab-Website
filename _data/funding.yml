# ─────────────────────────────────────────────────────────────
#  FELLOWSHIPS & SCHOLARSHIPS
#  A curated list of funding students can bring to (or pursue for) the lab.
#  Shown as a table on the Lab Guide "Applying for funding" page and linked
#  from Join. Add an entry by copying a block; omit `eligibility` or `url`
#  when there isn't one.
#    level       : e.g. "UG", "Masters, PhD", "Post Doc"
#    eligibility : any restriction (citizenship, identity, …); leave off if open
#    url         : official application page
#
#  EXAMPLE
#  - name: AAUW International Fellowships
#    level: "Masters, PhD, Post Doc"
#    eligibility: "International · Woman/Non-binary"
#    url: https://www.aauw.org/resources/programs/fellowships-grants/current-opportunities/international/
# ─────────────────────────────────────────────────────────────
